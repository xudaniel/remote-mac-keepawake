name: Bug report
description: Report a reproducible product defect without exposing private machine data.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, webhook URLs, hostnames, usernames, IP addresses, serial numbers, locations, or private dashboard screenshots.
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - KeepAwake CLI
        - Heartbeat reporter
        - Mac Pulse dashboard
        - Release or documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic values and redact machine identity.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include only the smallest secret-free log or status excerpt needed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets and identifying machine data from this report.
          required: true
