name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Bash
        run: shellcheck bin/remote-mac-keepawake bin/remote-mac-heartbeat tests/test.sh tests/docs-test.sh tests/heartbeat-test.sh .github/tests/launchd-integration.sh

  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify executable modes
        run: test -x bin/remote-mac-keepawake && test -x bin/remote-mac-heartbeat && test -x tests/test.sh && test -x tests/docs-test.sh && test -x tests/heartbeat-test.sh
      - name: Check Bash syntax
        run: bash -n bin/remote-mac-keepawake bin/remote-mac-heartbeat tests/test.sh tests/docs-test.sh tests/heartbeat-test.sh .github/tests/launchd-integration.sh
      - name: Run reliability suite
        run: ./tests/test.sh
      - name: Verify bilingual release documentation
        run: ./tests/docs-test.sh
      - name: Verify private heartbeat reporter
        run: ./tests/heartbeat-test.sh

  dashboard:
    name: Dashboard build, tests, and migrations
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Lint dashboard source
        run: npm run lint
      - name: Build and test dashboard
        run: npm test

  pages-app:
    name: GitHub Pages app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify static application
        run: |
          node --check pages/app.js
          node --test tests/pages-app.test.mjs

  launchd-integration:
    name: launchd restart and assertion integration
    runs-on: macos-15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise a real user LaunchAgent
        run: ./.github/tests/launchd-integration.sh
